name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo files
        run: ls -la

      - name: Prepare site files
        run: |
          mkdir -p _site
          if [ -f "index.html" ]; then cp index.html _site/; echo "Copied index.html"; else echo "ERROR: index.html not found"; exit 1; fi
          if [ -f "HollowRift-1.0.0.jar" ]; then cp HollowRift-1.0.0.jar _site/; echo "Copied JAR"; else echo "ERROR: JAR not found"; exit 1; fi

      - name: Verify _site contents
        run: ls -la _site/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _site/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4